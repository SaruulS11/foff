<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Action</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<button onclick="changeColor()">Click Me Bitchhhhhh!</button>

<script>
  function changeColor() {
    document.body.style.backgroundColor = 
      document.body.style.backgroundColor === 'lightblue' ? 'lightgreen' : 'lightblue';
  }
</script>

</body>
</html>
